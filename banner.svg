<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" width="1200" height="270" role="img" aria-label="Daniel Batista — Security and Infrastructure Analyst, Automation and Integration, Blue Team / SOC" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="55%" stop-color="#0F1520"/>
      <stop offset="100%" stop-color="#0A1A24"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="45%" stop-color="#BC8CFF"/>
      <stop offset="75%" stop-color="#2EA6A0"/>
      <stop offset="100%" stop-color="#3FB950"/>
    </linearGradient>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0 L0 0 0 28" fill="none" stroke="#58A6FF" stroke-width="0.5" opacity="0.07"/>
    </pattern>

    <clipPath id="round">
      <rect x="0" y="0" width="1200" height="270" rx="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="270" fill="url(#bg)"/>
    <rect width="1200" height="270" fill="url(#grid)"/>

    <!-- soft glow -->
    <circle cx="1060" cy="50" r="180" fill="#58A6FF" opacity="0.05"/>
    <circle cx="1140" cy="230" r="130" fill="#BC8CFF" opacity="0.04"/>

    <!-- terminal chrome -->
    <rect x="0" y="0" width="1200" height="38" fill="#161B22"/>
    <circle cx="26" cy="19" r="5.5" fill="#FF5F57"/>
    <circle cx="46" cy="19" r="5.5" fill="#FEBC2E"/>
    <circle cx="66" cy="19" r="5.5" fill="#28C840"/>
    <text x="96" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="13" fill="#8B949E">ylqz.cybersec@proton.me: ~/profile</text>

    <!-- prompt -->
    <text x="48" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
      <tspan fill="#3FB950">$</tspan>
      <tspan fill="#8B949E" dx="10">whoami</tspan>
    </text>
    <rect x="140" y="75" width="9" height="17" fill="#3FB950" opacity="0.6"/>

    <!-- name -->
    <text x="48" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="34" font-weight="700" fill="#E6EDF3" letter-spacing="0.5">Daniel Batista</text>

    <!-- subtitle -->
    <text x="48" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="17" fill="#58A6FF">
      Security &amp; Infrastructure Analyst
      <tspan fill="#30363D" dx="12">/</tspan>
      <tspan fill="#BC8CFF" dx="12">Automation &amp; Integration</tspan>
      <tspan fill="#30363D" dx="12">/</tspan>
      <tspan fill="#2EA6A0" dx="12">Blue Team · SOC</tspan>
    </text>

    <!-- meta line 1 -->
    <text x="48" y="208" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="13.5" fill="#6E7681">
      10+ years in IT
      <tspan dx="12" fill="#30363D">|</tspan>
      <tspan dx="12">DPO · LGPD</tspan>
      <tspan dx="12" fill="#30363D">|</tspan>
      <tspan dx="12">IAM · Active Directory</tspan>
      <tspan dx="12" fill="#30363D">|</tspan>
      <tspan dx="12">Incident Response</tspan>
    </text>

    <!-- meta line 2 -->
    <text x="48" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="13.5" fill="#6E7681">CompTIA Security+ in progress</text>

    <!-- accent rule -->
    <rect x="0" y="265" width="1200" height="5" fill="url(#accent)"/>
  </g>
</svg>
